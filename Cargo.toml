[workspace]
members = [ 
    "content-hashing",
    "file-sharing",
    "ghost-ground",
    "ghost-space",
    "metadata-mrkl",
]

resolver = "2"

[package]
name = "intnet"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
async-std = { version = "1.13.0", features = ["attributes"] }
libp2p = { version = "0.54.1", features = [ "tokio", "cbor", "dns", "kad", "noise", "ping", "macros", "request-response", "tcp", "quic", "websocket", "yamux"] }
tokio = { version = "1.42.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
content-hashing = { path = "./content-hashing" }
file-sharing    = { path = "./file-sharing" }
metadata-mrkl   = { path = "./metadata-mrkl" }

