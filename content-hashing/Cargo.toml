[package]
name = "content-hashing"
version = "0.1.0"
author = ["VRONA | The Decentralized Intelligence Lab <travis@vrona.xyz>"]
description = "Encryption content, Hashing checking"
repository = "https://github.com/vrona/intnet"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
blake3 = "1.5.5"
hex = "0.4.3"
multihash = "0.19.3"
multihash-codetable = {version = "0.1.4", features = ["sha2"]}
rand = "0.8.5"
tokio = { version = "1.42.0", features = ["full"] }
typenum = "1.17.0"