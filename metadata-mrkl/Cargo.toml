[package]
name = "metadata-mrkl"
version = "0.1.0"
author = ["VRONA | The Decentralized Intelligence Lab <travis@vrona.xyz>"]
description = "Merkle Tree applied to metadata"
repository = "https://github.com/vrona/intnet"
edition = "2021"


[dependencies]
anyhow = "1.0.95"
bincode = "1.3.3"
blake3 = "1.5.5"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
hex = "0.4.3"
monotree = {version = "0.2", features = ["db_sled"]}
rand = "0.8.5"
rs_merkle = "1.4.2"
tokio = { version = "1.42.0", features = ["full"] }